[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-physician"
version = "0.1.0"
description = "Grounded surgical-explanation and virtual-agent research reimplementation"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
speech = ["kokoro>=0.9.4", "soundfile", "faster-whisper>=1.1"]
gesture = ["torch>=2.1", "scikit-learn>=1.3"]

[project.scripts]
virtual-physician = "virtual_physician.server:main"
virtual-physician-validate = "virtual_physician.content:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtual_physician = []
